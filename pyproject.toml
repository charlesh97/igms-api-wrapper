[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igms-api-wrapper"
version = "0.1.0"
description = "Python wrapper and CLI for the iGMS property management API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
igms = "igms_wrapper.cli:main"

[tool.setuptools]
packages = ["igms_wrapper"]
